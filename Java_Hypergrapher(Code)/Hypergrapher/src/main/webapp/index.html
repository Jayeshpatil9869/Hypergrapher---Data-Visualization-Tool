<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypergrapher Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-gray-800 font-sans antialiased">

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    
    <!-- Header -->
    <header class="mb-10 text-center">
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-4 tracking-tight">
            HyperGrapher
        </h1>
        <p class="text-xl text-gray-500 font-medium">The Intelligent Data Visualization Tool</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Controls Panel (Left) -->
        <div class="lg:col-span-1 glass-panel p-8 rounded-2xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-4">Data Source</h2>
            
            <form id="uploadForm" class="space-y-6">
                <!-- File Input -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Upload CSV File</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="csv-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-white hover:bg-gray-50 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <p class="mb-2 text-sm text-gray-500 font-semibold" id="file-name">Click to upload or drag and drop</p>
                                <p class="text-xs text-gray-500">.CSV files only</p>
                            </div>
                            <input id="csv-file" name="fileinput" type="file" accept=".csv" class="hidden" required />
                        </label>
                    </div>
                </div>

                <!-- Graph Type Selector -->
                <div>
                    <label for="graphtype" class="block text-sm font-semibold text-gray-700 mb-2">Select Graph Type</label>
                    <select id="graphtype" name="graphtype" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 outline-none transition-shadow" required>
                        <option value="" disabled selected>-- Choose a Chart --</option>
                        <option value="line">Line Chart</option>
                        <option value="bar">Bar Chart</option>
                        <option value="pie">Pie Chart</option>
                        <option value="doughnut">Doughnut Chart</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full text-white bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-bold rounded-lg text-lg px-5 py-3 text-center shadow-lg transition-transform transform hover:-translate-y-0.5">
                    Generate Visualization
                </button>
            </form>
            
            <!-- Error Alert -->
            <div id="errorAlert" class="hidden mt-4 p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
                <span class="font-medium">Error!</span> <span id="errorMsg"></span>
            </div>
        </div>

        <!-- Canvas Panel (Right) -->
        <div class="lg:col-span-2 glass-panel p-8 rounded-2xl flex flex-col items-center justify-center min-h-[500px] relative">
            
            <!-- Loading Spinner -->
            <div id="loading" class="hidden absolute inset-0 flex items-center justify-center bg-white/50 rounded-2xl backdrop-blur-sm z-10">
                <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center text-gray-400">
                <svg class="mx-auto h-24 w-24 mb-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <h3 class="text-xl font-bold text-gray-500">No Data Rendered</h3>
                <p class="mt-1">Upload a CSV to see the magic happen.</p>
            </div>

            <!-- Chart Canvas -->
            <canvas id="myChart" class="w-full h-full hidden"></canvas>
            
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
